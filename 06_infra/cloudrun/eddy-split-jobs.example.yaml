# EXAMPLE ONLY - not deployed, not qualified. Placeholders in <...> must be
# replaced by the deploying team, who also own IAM, bucket layout, the
# Cloud Storage FUSE volume options, resource sizing and scheduling. Check the
# field names against the current Cloud Run Jobs documentation before use.
#
# File-based eddy silver job. Reads ONE immutable flux and ONE immutable biomet
# Parquet file from a read-only input mount and publishes a fresh run directory
# on a writable output mount (completion manifest written last; see
# docs/RUN_PUBLICATION.md). miaproc uses no cloud SDK, credentials or network
# for data processing. <SILVER_RUN> must be unique per execution and never
# reused, also after a failure (e.g. silver-<SITE_OR_ALL>-<WINDOW>-<ATTEMPT>);
# the orchestrator renders a new job execution (or arg override) per attempt.
apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: miaproc-eddy-silver-example
  namespace: <PROJECT_ID>
  labels:
    app: miaproc
    domain: eddy
    stage: silver
    example: "true"
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/execution-environment: gen2
    spec:
      parallelism: 1
      taskCount: 1
      template:
        spec:
          serviceAccountName: <SERVICE_ACCOUNT_EMAIL>
          maxRetries: 0
          timeoutSeconds: 1800
          containers:
          - name: miaproc
            image: <IMAGE_URI_PINNED_BY_DIGEST>
            command: ["miaproc"]
            args:
            - eddy
            - run-silver
            - --flux-parquet=/mnt/in/<WINDOW>/flux.parquet
            - --biomet-parquet=/mnt/in/<WINDOW>/biomet.parquet
            - --group-column=site_id
            - --run-dir=/mnt/out/<SILVER_RUN>
            - --output-table=/mnt/out/<SILVER_RUN>/silver.parquet
            - --output-run-json=/mnt/out/<SILVER_RUN>/silver_run.json
            - --scratch-dir=/tmp/miaproc-scratch
            - --scratch-max-bytes=<SCRATCH_BYTES>
            volumeMounts:
            - name: eddy-in
              mountPath: /mnt/in
              readOnly: true
            - name: eddy-out
              mountPath: /mnt/out
            resources:
              limits:
                cpu: "2"
                memory: 4Gi
          volumes:
          - name: eddy-in
            csi:
              driver: gcsfuse.run.googleapis.com
              readOnly: true
              volumeAttributes:
                bucketName: <INPUT_BUCKET>
          - name: eddy-out
            csi:
              driver: gcsfuse.run.googleapis.com
              readOnly: false
              volumeAttributes:
                bucketName: <OUTPUT_BUCKET>
---
# File-based eddy gold job (R-backed reference engine). Reads the table of a
# PUBLISHED silver run (miaproc validates the silver run's completion manifest
# before any engine work) and publishes a fresh gold run directory. Start it
# only after `miaproc eddy validate-run --run-dir /mnt/out/<SILVER_RUN>
# --stage silver` succeeded. --repo-root=/app lets the project-scoped R
# preflight (Decision 010) resolve the baked renv.lock and R library; without
# approval the job exits 2. Use --engine=hesseflux-native for a Python-only run.
apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: miaproc-eddy-gold-example
  namespace: <PROJECT_ID>
  labels:
    app: miaproc
    domain: eddy
    stage: gold
    example: "true"
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/execution-environment: gen2
    spec:
      parallelism: 1
      taskCount: 1
      template:
        spec:
          serviceAccountName: <SERVICE_ACCOUNT_EMAIL>
          maxRetries: 0
          timeoutSeconds: 3600
          containers:
          - name: miaproc
            image: <IMAGE_URI_PINNED_BY_DIGEST>
            command: ["miaproc"]
            args:
            - eddy
            - run-gold
            - --silver-table=/mnt/out/<SILVER_RUN>/silver.parquet
            - --engine=reddyproc-reference
            - --repo-root=/app
            - --group-column=site_id
            - --run-dir=/mnt/out/<GOLD_RUN>
            - --output-table=/mnt/out/<GOLD_RUN>/gold.parquet
            - --output-diagnostics-json=/mnt/out/<GOLD_RUN>/gold_diag.json
            - --output-run-json=/mnt/out/<GOLD_RUN>/gold_run.json
            - --scratch-dir=/tmp/miaproc-scratch
            - --scratch-max-bytes=<SCRATCH_BYTES>
            volumeMounts:
            - name: eddy-out
              mountPath: /mnt/out
            resources:
              limits:
                cpu: "2"
                memory: 8Gi
          volumes:
          - name: eddy-out
            csi:
              driver: gcsfuse.run.googleapis.com
              readOnly: false
              volumeAttributes:
                bucketName: <OUTPUT_BUCKET>
---
# Consumer check job. Exit 0 prints a JSON summary of a valid run; an
# incomplete or mismatched run exits 3. Decide with this check, never with the
# producer's exit code alone (exit 5 or an unknown status can coexist with a
# valid published run). <STAGE> is silver or gold.
apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: miaproc-eddy-validate-run-example
  namespace: <PROJECT_ID>
  labels:
    app: miaproc
    domain: eddy
    stage: validate
    example: "true"
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/execution-environment: gen2
    spec:
      parallelism: 1
      taskCount: 1
      template:
        spec:
          serviceAccountName: <SERVICE_ACCOUNT_EMAIL>
          maxRetries: 0
          timeoutSeconds: 600
          containers:
          - name: miaproc
            image: <IMAGE_URI_PINNED_BY_DIGEST>
            command: ["miaproc"]
            args:
            - eddy
            - validate-run
            - --run-dir=/mnt/out/<RUN_TO_CHECK>
            - --stage=<STAGE>
            volumeMounts:
            - name: eddy-out
              mountPath: /mnt/out
              readOnly: true
            resources:
              limits:
                cpu: "1"
                memory: 2Gi
          volumes:
          - name: eddy-out
            csi:
              driver: gcsfuse.run.googleapis.com
              readOnly: true
              volumeAttributes:
                bucketName: <OUTPUT_BUCKET>
